name: CI/CD Quality Gate

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-checks:
    name: Backend Syntax & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Verify backend syntax & run automated test suite
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-key-123456
        run: npm test --prefix backend

  frontend-build-and-lint:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Run Frontend ESLint
        run: npm run lint --prefix frontend

      - name: Run Full Monorepo Build (Vercel Simulation)
        run: npm run build

      - name: Verify Vercel Output Directory (frontend/dist)
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/avatar.svg
          test -f frontend/dist/media/dashboard-preview.svg
          echo "✅ frontend/dist build artifacts verified successfully!"